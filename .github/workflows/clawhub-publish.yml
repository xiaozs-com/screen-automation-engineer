name: Publish Skill to ClawHub

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "agents/**"
      - "references/**"
      - "scripts/**"
      - ".clawhubignore"
      - ".github/workflows/clawhub-publish.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.skill-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: skill-version
        name: Read the SkillHub version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          text = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.search(r"(?m)^  version:\\s*['\"]?([^'\"\\s#]+)", text)
          if not match:
              raise SystemExit("metadata.version is missing from SKILL.md")
          version = match.group(1)
          if not re.fullmatch(r"v?\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"metadata.version is not a SemVer version: {version}")
          version = version.removeprefix("v")
          git_ref = os.environ.get("GITHUB_REF", "")
          if git_ref.startswith("refs/tags/") and git_ref != f"refs/tags/v{version}":
              raise SystemExit(
                  f"Tag {git_ref.removeprefix('refs/tags/')} does not match "
                  f"SKILL.md metadata.version {version}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\\n")

  dry-run:
    if: github.event_name == 'pull_request'
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preview ClawHub release
        run: npx --yes clawhub@0.23.3 skill publish . --owner xiaozs-com --version "${{ needs.resolve-version.outputs.version }}" --dry-run

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure ClawHub authentication
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::Missing repository secret CLAWHUB_TOKEN"
            exit 1
          fi
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"
          npx --yes clawhub@0.23.3 login --token "$CLAWHUB_TOKEN"

      - name: Publish matching ClawHub version
        run: npx --yes clawhub@0.23.3 skill publish . --owner xiaozs-com --version "${{ needs.resolve-version.outputs.version }}"
