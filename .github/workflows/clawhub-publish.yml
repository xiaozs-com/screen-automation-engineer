name: Publish Skill to ClawHub

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "agents/**"
      - "references/**"
      - "scripts/**"
      - ".clawhubignore"
      - ".github/workflows/clawhub-publish.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v1
    with:
      owner: xiaozs-com
      skill_path: .
      dry_run: true

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v1
    with:
      owner: xiaozs-com
      skill_path: .
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
